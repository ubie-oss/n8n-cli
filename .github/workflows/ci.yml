name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # ratchet:biomejs/setup-biome@v2
        with:
          version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint and format check
        run: biome check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate schemas
        run: bun run generate-schemas

      - name: Type check
        run: bunx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate schemas
        run: bun run generate-schemas

      - name: Run tests
        run: bun test

  # Named gate for the CLI → proxy → mock n8n hop. `bun test` above already
  # includes these files; this job exists so a contract break between the CLI
  # HTTP client and the proxy shows up as its own required check, not a line
  # buried in the unit suite.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate schemas
        run: bun run generate-schemas

      - name: Run CLI → proxy → mock n8n tests
        run: bun test tests/integration/

  licenses:
    name: Third-Party Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Several bundled dependencies are under the n8n Sustainable Use License,
      # whose Notices clause requires shipping the terms with the binary. Fail
      # the build if the checked-in notice no longer matches the lockfile.
      - name: Verify THIRD_PARTY_LICENSES.md is up to date
        run: bun run check-third-party-licenses

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, licenses, integration]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: make build

      - name: Verify binary size
        run: make size-check

      - name: Smoke test
        run: ./n8n-cli version

      # The `.ts` workflow format is parsed by @n8n/workflow-sdk's AST
      # interpreter, which is bundled into the binary. Exercise it end-to-end so
      # a bundling regression cannot ship silently.
      - name: Smoke test the .ts workflow format
        run: |
          mkdir -p /tmp/defs
          cat > /tmp/defs/smoke__wf-smoke.ts <<'EOF'
          import { workflow, trigger } from "@n8n/workflow-sdk";

          const t = trigger({
            type: 'n8n-nodes-base.manualTrigger',
            version: 1,
            config: { name: 'Trigger' }
          });

          const wf = workflow('wf-smoke', 'Smoke');

          export default wf.add(t)
          EOF
          cat > /tmp/defs/not-a-workflow.ts <<'EOF'
          export const helper = (a: number) => a + 1;
          EOF

          # Without --ts the directory scan must ignore .ts entirely, so there is
          # nothing to convert. A definitions directory full of ordinary
          # TypeScript must never be mistaken for workflows.
          ! ./n8n-cli convert --format json -d /tmp/defs --keep 2>/dev/null
          test ! -f /tmp/defs/smoke__wf-smoke.json

          ./n8n-cli convert --format json -d /tmp/defs --ts --keep || true
          test -f /tmp/defs/smoke__wf-smoke.json
          grep -q '"name": "Smoke"' /tmp/defs/smoke__wf-smoke.json
