name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # ratchet:biomejs/setup-biome@v2
        with:
          version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate schemas
        run: bun run generate-schemas

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint and format check
        run: biome check src/ tests/

      - name: Run tests
        run: bun test

      - name: Verify THIRD_PARTY_LICENSES.md is up to date
        run: bun run check-third-party-licenses

  build:
    name: Build (${{ matrix.target }})
    # macOS targets run on a macOS runner so codesign is available; see the
    # ad-hoc signing step below for why they need it.
    runs-on: ${{ matrix.runner }}
    needs: [test]
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: n8n-cli-darwin-arm64
            runner: macos-latest
            sign: true
          - target: bun-darwin-x64
            artifact: n8n-cli-darwin-x64
            runner: macos-latest
            sign: true
          - target: bun-linux-x64
            artifact: n8n-cli-linux-x64
            runner: ubuntu-latest
          - target: bun-windows-x64
            artifact: n8n-cli-windows-x64.exe
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate schemas
        run: bun run generate-schemas

      - name: Determine version info
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.artifact }} \
            --minify \
            --define "CLI_VERSION='${{ steps.version.outputs.version }}'" \
            --define "CLI_GIT_COMMIT='${{ steps.version.outputs.commit }}'" \
            --define "CLI_BUILD_DATE='${{ steps.version.outputs.date }}'"

      # `bun build --compile` appends the bundle to a copy of the bun runtime.
      # The runtime ships with an ad-hoc (linker-signed) signature covering the
      # original bytes, so once the bundle is appended that signature no longer
      # matches and the binary is left in a "code or signature have been
      # modified" state. On Apple Silicon a valid signature is mandatory, so
      # macOS may refuse to run it at all — SIGKILL before main(), which looks
      # like the binary silently doing nothing (`--help` prints an empty
      # string, exit 137).
      #
      # Re-signing ad-hoc recomputes the hashes over the final bytes. This is
      # not notarization and grants no Gatekeeper trust — it only makes the
      # file internally consistent, which is what the kernel checks here.
      #
      # Verified afterwards so a signing failure breaks the release instead of
      # shipping a binary that cannot start.
      - name: Ad-hoc sign the macOS binary
        if: matrix.sign
        run: |
          codesign --force --sign - "dist/${{ matrix.artifact }}"
          codesign --verify --verbose "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      # The binary links dependencies under the n8n Sustainable Use License,
      # whose Notices clause requires that recipients also receive its terms.
      # Ship the notice next to the binaries it describes.
      - name: Stage third-party license notice
        run: cp THIRD_PARTY_LICENSES.md dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # ratchet:softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/n8n-cli-darwin-arm64
            dist/n8n-cli-darwin-x64
            dist/n8n-cli-linux-x64
            dist/n8n-cli-windows-x64.exe
            dist/THIRD_PARTY_LICENSES.md
            dist/checksums.txt
